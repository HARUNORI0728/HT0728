<title>フィットア奪還戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* Layout: one column — status line, map, then an info/command panel; dialogue and title sit on top as overlays. */
  :root {
    color-scheme: dark;
    --night: #14121c; --panel: #1d1a2a; --line: #3a3350; --ink: #f1e9d2; --dim: #a79fb8;
    --gold: #e8c56a; --ally: #8fc1ff; --foe: #ff9a8f; --rose: #ff8fa8; --heal: #8fe0a0;
    --ally-deep: #274a8c; --foe-deep: #8a2f3c; --ally-bg: #2c3f6a; --foe-bg: #5a2632; --shade: 10, 9, 16;
    --pixel: "DotGothic16", "IPAGothic", "MS Gothic", monospace;
    --text: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  #app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #hud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--pixel); }
  #chTitle { color: var(--gold); font-size: 18px; letter-spacing: .06em; }
  #turn { color: var(--dim); font-size: 14px; }
  #turn b { font-weight: normal; }
  #turn b.blue { color: var(--ally); } #turn b.red { color: var(--foe); }
  #stage { position: relative; border: 2px solid #6a5a3a; border-radius: 8px; overflow: hidden; line-height: 0; box-shadow: 0 0 0 1px #0008, 0 6px 18px #0008; }
  #cv { width: 100%; height: auto; display: block; cursor: pointer; touch-action: manipulation; background: #14121c; }
  #banner {
    position: absolute; left: 0; right: 0; top: 38%; padding: 14px 8px; text-align: center; line-height: 1.5;
    background: linear-gradient(90deg, #18152400, #262238ee 18%, #181524ee 82%, #18152400); border-block: 1.5px solid var(--gold); color: var(--gold);
    text-shadow: 0 0 12px #e8c56a88;
    font-family: var(--pixel); font-size: clamp(16px, 4.5vw, 24px); letter-spacing: .12em; pointer-events: none; white-space: pre-line;
  }
  #banner.small { font-size: clamp(13px, 3.4vw, 18px); letter-spacing: .04em; }
  /* Battle cut-in: the two fighters slide in from their sides over a dark band (about half a second). */
  #cutin { position: absolute; inset: 0; pointer-events: none; overflow: hidden; line-height: 0; }
  #cutin .ciband { position: absolute; left: -10%; right: -10%; top: 18%; height: 64%; transform: skewY(-6deg);
    background: linear-gradient(90deg, rgba(var(--shade), .55), rgba(var(--shade), .82) 30%, rgba(var(--shade), .82) 70%, rgba(var(--shade), .55));
    border-block: 2px solid var(--gold); box-shadow: 0 0 24px rgba(0, 0, 0, .6); opacity: 0; }
  #cutin .ci { position: absolute; bottom: 0; height: 100%; width: 75%; max-width: 50%; opacity: 0; }
  #cutin .ci img { height: 100%; width: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 0 2px rgba(var(--shade), .9)) brightness(.5) saturate(.6); }
  #cutin .ci.att img { filter: drop-shadow(0 0 2px rgba(var(--shade), .9)) drop-shadow(0 0 14px rgba(232, 197, 106, .45)); }
  #cutin .ci.sprite { height: 78%; bottom: 8%; }
  #cutin .ci.r.sprite img { transform: scaleX(-1); }
  #cutin .ci.l { left: 0; object-position: 0 100%; } #cutin .ci.r { right: 0; }
  #cutin.go .ciband { animation: ciBand .56s ease-out both; }
  #cutin.go .ci.l { animation: ciInL .56s cubic-bezier(.2, .8, .3, 1) both; }
  #cutin.go .ci.r { animation: ciInR .56s cubic-bezier(.2, .8, .3, 1) both; }
  @keyframes ciBand { 0% { opacity: 0; transform: skewY(-6deg) scaleY(.2); } 18% { opacity: 1; transform: skewY(-6deg) scaleY(1); } 82% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes ciInL { 0% { opacity: 0; transform: translateX(-45%); } 22% { opacity: 1; transform: translateX(0); } 80% { opacity: 1; transform: translateX(3%); } 100% { opacity: 0; transform: translateX(6%); } }
  @keyframes ciInR { 0% { opacity: 0; transform: translateX(45%); } 22% { opacity: 1; transform: translateX(0); } 80% { opacity: 1; transform: translateX(-3%); } 100% { opacity: 0; transform: translateX(-6%); } }
  #cutin .cicrit { position: absolute; top: 50%; left: 0; right: 0; text-align: center; line-height: 1; font-family: var(--pixel); color: var(--gold);
    font-size: clamp(26px, 9vw, 64px); letter-spacing: .2em; text-shadow: 0 0 18px #e8c56acc, 0 3px 0 #000a; opacity: 0; transform: translateY(-50%); }
  #cutin.crit .ci { width: 100%; max-width: 70%; }
  #cutin.crit[data-att="l"] .ci.l { left: 0; } #cutin.crit[data-att="r"] .ci.r { right: 0; }
  #cutin.crit .ciband { background: linear-gradient(90deg, rgba(120, 70, 10, .6), rgba(var(--shade), .85) 40%, rgba(120, 70, 10, .6)); border-width: 3px; }
  #cutin.crit.go .ci { animation-duration: .72s; } #cutin.crit.go .ciband { animation-duration: .72s; }
  #cutin.crit.go .cicrit { animation: ciCrit .72s ease-out both; }
  #cutin.crit.go::after { content: ''; position: absolute; inset: 0; background: #fff; animation: ciFlash .72s ease-out both; }
  #cutin.crit[data-att="l"] .cicrit { padding-left: 38%; } #cutin.crit[data-att="r"] .cicrit { padding-right: 38%; }
  @keyframes ciCrit { 0%, 15% { opacity: 0; transform: translateY(-50%) scale(1.8); } 30% { opacity: 1; transform: translateY(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes ciFlash { 0% { opacity: .85; } 25% { opacity: 0; } 100% { opacity: 0; } }
  /* 山場の見せ場（ボスの名乗り・章タイトル・勝敗・クラスチェンジ・結婚・支援ランク上昇）。タップで飛ばせる。 */
  #show { position: fixed; inset: 0; z-index: 40; overflow: hidden; line-height: 1.4; cursor: pointer; font-family: var(--pixel); --acc: var(--gold); --accRgb: 232, 197, 106; }
  #show.boss, #show.lose { --acc: #ff8f80; --accRgb: 255, 120, 100; }
  #show.wed, #show.sup { --acc: var(--rose); --accRgb: 255, 143, 168; }
  #show .shVeil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(20, 17, 32, .55), rgba(10, 9, 16, .82) 75%); opacity: 0; transition: opacity .25s; }
  #show.chapter .shVeil { background: radial-gradient(ellipse at 50% 45%, rgba(24, 21, 36, .92), rgba(10, 9, 16, .98) 70%); }
  #show.boss .shVeil { background: linear-gradient(90deg, rgba(40, 8, 8, .25), rgba(30, 8, 10, .7) 55%, rgba(60, 10, 10, .8)); }
  #show.go .shVeil { opacity: 1; }
  #show .shRing { position: absolute; left: 50%; top: 36%; width: min(58vh, 84vw); aspect-ratio: 1; margin-left: calc(min(58vh, 84vw) / -2); margin-top: calc(min(58vh, 84vw) / -2); border-radius: 50%;
    border: 3px solid var(--acc); box-shadow: 0 0 28px 6px rgba(var(--accRgb), .55), inset 0 0 28px 4px rgba(var(--accRgb), .4); opacity: 0; pointer-events: none; }
  #show.cc.go .shRing, #show.wed.go .shRing, #show.sup.go .shRing { animation: shRing 1.3s ease-out both; }
  #show.cc.go .shRing.two, #show.wed.go .shRing.two { animation-delay: .28s; }
  @keyframes shRing { 0% { opacity: 0; transform: scale(.15); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
  #show .shPics { position: absolute; left: 0; right: 0; top: 6%; height: 52%; display: flex; justify-content: center; align-items: flex-end; gap: 2%; padding: 0 4%; }
  #show .shPics img { height: 100%; max-width: 46%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 0 3px rgba(0, 0, 0, .9)) drop-shadow(0 0 18px rgba(var(--accRgb), .45)); opacity: 0; }
  #show .shPics img.solo { max-width: 92%; }
  #show.go .shPics img { animation: shPicIn .5s cubic-bezier(.2, .8, .3, 1) .08s both; }
  #show.boss .shPics { justify-content: flex-end; top: 0; height: 64%; padding-right: 3%; }
  #show.boss.go .shPics img { animation: shPicR .55s cubic-bezier(.2, .8, .3, 1) both; filter: drop-shadow(0 0 3px rgba(0, 0, 0, .9)) drop-shadow(0 0 22px rgba(255, 90, 70, .5)); }
  @keyframes shPicIn { from { opacity: 0; transform: translateY(6%) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes shPicR { from { opacity: 0; transform: translateX(30%); } to { opacity: 1; transform: none; } }
  #show .shBand { position: absolute; left: 0; right: 0; top: 60%; padding: 12px 16px 14px; text-align: center; color: var(--ink);
    background: linear-gradient(90deg, rgba(24, 21, 36, 0), rgba(30, 26, 46, .94) 16%, rgba(24, 21, 36, .94) 84%, rgba(24, 21, 36, 0)); opacity: 0; }
  #show .shBand::before, #show .shBand::after { content: ''; position: absolute; left: 6%; right: 6%; height: 1.5px; background: linear-gradient(90deg, transparent, var(--acc) 20%, var(--acc) 80%, transparent); transform: scaleX(0); }
  #show .shBand::before { top: 0; } #show .shBand::after { bottom: 0; }
  #show.go .shBand { animation: shBand .35s ease-out .12s both; }
  #show.go .shBand::before, #show.go .shBand::after { animation: shLine .6s ease-out .12s both; }
  @keyframes shBand { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes shLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  #show .shSub { display: block; font-size: clamp(12px, 3.4vw, 16px); color: var(--acc); letter-spacing: .16em; }
  #show .shSub:empty, #show .shNote:empty { display: none; }
  #show .shMain { display: block; font-weight: normal; font-size: clamp(19px, 5.6vw, 30px); letter-spacing: .1em; color: #fff7e2; text-shadow: 0 0 14px rgba(var(--accRgb), .55); text-wrap: balance; }
  #show .shNote { display: block; margin-top: 4px; font-size: clamp(12px, 3.3vw, 15px); color: var(--heal); letter-spacing: .04em; }
  #show.chapter .shBand, #show.win .shBand, #show.lose .shBand { top: 50%; transform: translateY(-50%); padding: 18px 16px 20px; }
  #show.chapter.go .shBand, #show.win.go .shBand, #show.lose.go .shBand { animation: shFade .6s ease-out .1s both; }
  @keyframes shFade { from { opacity: 0; letter-spacing: .4em; } to { opacity: 1; } }
  #show.chapter .shMain { font-size: clamp(28px, 8.4vw, 48px); letter-spacing: .24em; padding-left: .24em; }
  #show.win .shMain, #show.lose .shMain { font-size: clamp(30px, 9vw, 52px); letter-spacing: .3em; padding-left: .3em; }
  #show.boss .shBand { top: 64%; text-align: right; padding-right: 8%; background: linear-gradient(90deg, rgba(40, 10, 12, 0), rgba(50, 14, 16, .9) 30%, rgba(30, 10, 12, .95)); }
  #show.boss.go .shBand { animation: shBossBand .4s ease-out .15s both; }
  @keyframes shBossBand { from { opacity: 0; transform: translateX(-12%); } to { opacity: 1; transform: none; } }
  #show.out { opacity: 0; transition: opacity .22s; }
  #show .shSkip { position: absolute; right: 12px; bottom: max(10px, env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  @media (max-width: 560px) { #show .shPics { top: 10%; height: 46%; } #show.boss .shPics { height: 58%; top: 2%; } #show .shBand { top: 58%; } #show.boss .shBand { top: 60%; padding-right: 6%; } }
  @media (prefers-reduced-motion: reduce) { #show.go * , #show.go *::before, #show.go *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
  /* スキル・連携の発動帯（小さな帯＋顔アイコン） */
  #skillBand { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px; line-height: 1.2; pointer-events: none;
    background: linear-gradient(90deg, rgba(20, 30, 48, .95), rgba(20, 30, 48, .85) 80%, rgba(20, 30, 48, 0)); border: 1px solid #6fb8d8; border-radius: 26px; color: #c8f2ff; font-family: var(--pixel);
    font-size: clamp(13px, 3.6vw, 17px); letter-spacing: .08em; white-space: nowrap; box-shadow: 0 0 12px rgba(111, 184, 216, .45); }
  #skillBand.link { border-color: var(--rose); color: #ffd6e0; box-shadow: 0 0 12px rgba(255, 143, 168, .45); background: linear-gradient(90deg, rgba(48, 20, 32, .95), rgba(48, 20, 32, .85) 80%, rgba(48, 20, 32, 0)); }
  #skillBand .uicon { width: 34px; height: 34px; border-radius: 50%; }
  #skillBand small { color: var(--dim); font-size: .75em; margin-right: 2px; }
  #skillBand.go { animation: skIn .9s ease-out both; }
  @keyframes skIn { 0% { opacity: 0; transform: translate(-50%, -8px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #cutin.go .ci, #cutin.go .ciband, #cutin.go .cicrit { animation-duration: .01s; } #cutin.crit.go::after { display: none; } }
  #panel { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; align-items: start; }
  #info { background: linear-gradient(#262238, #1b1828); border: 1.5px solid #4a4060; border-radius: 8px; box-shadow: 0 4px 14px #0006; padding: 10px 12px; min-height: 132px; min-width: 0; }
  #menu { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 560px) {
    #panel { grid-template-columns: minmax(0, 1fr); }
    #menu { flex-direction: row; flex-wrap: wrap; }
    #menu button { flex: 1 1 130px; }
  }
  button {
    font: inherit; font-family: var(--pixel); font-size: 15px; color: var(--ink); background: var(--panel);
    border: 2px solid var(--line); border-radius: 4px; min-height: 44px; padding: 6px 12px; cursor: pointer; text-align: center;
  }
  button:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  #goal { margin: 0; color: var(--dim); font-size: 12.5px; }
  #bonusGoal { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  #bonusGoal .ok { color: #9fd98a; } #bonusGoal .ng { color: #a79fb8; text-decoration: line-through; } #bonusGoal b { font-weight: normal; color: var(--gold); }
  .hint { color: var(--dim); margin: 0; }
  .uhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--pixel); }
  .uhead b { font-size: 17px; font-weight: normal; }
  .blue { color: var(--ally); } .red { color: var(--foe); }
  .uhead span { color: var(--dim); font-size: 13px; }
  .hp { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; margin: 4px 0 6px; }
  .bar { flex: 1; height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 0 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--dim); margin-right: 6px; }
  .wps { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .benchUp { font-size: 13px; color: var(--heal); margin-top: 4px; font-family: var(--pixel); }
  .benchUp b { font-weight: normal; color: var(--gold); }
  #campGold { margin: 0; font-family: var(--pixel); color: var(--dim); }
  #campGold b { font-weight: normal; color: var(--gold); font-size: 18px; }
  .inv { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 6px; }
  .invRow { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 32px; font-size: 13px; }
  .invRow .invName { font-family: var(--pixel); font-size: 14px; color: var(--ink); }
  .invRow .invName small { color: var(--dim); font-size: 12px; }
  .invRow > small { color: var(--dim); font-variant-numeric: tabular-nums; flex: 1 1 auto; }
  .invRow .invBtn { min-height: 36px; padding: 2px 10px; font-size: 13px; margin-left: auto; }
  .eqTag { font-style: normal; color: var(--night); background: var(--gold); border-radius: 3px; padding: 0 5px; margin-right: 6px; font-size: 12px; }
  .invCap { font-size: 12px; color: var(--dim); font-family: var(--pixel); }
  .pick.shopItem em { color: var(--gold); border-color: var(--gold); }
  .fc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 12px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--pixel); }
  .fc .k { color: var(--gold); font-size: 12px; align-self: center; }
  .fc .n { font-size: 16px; }
  .fc .fcwho { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .fc .fcwho span { font-size: 15px; overflow-wrap: anywhere; line-height: 1.3; }
  .fc .k.vs { font-size: 15px; letter-spacing: .1em; text-shadow: 0 0 10px #e8c56a88; }
  /* Face badges: the portrait cropped around the face (--fx/--fy = face centre), or the top of the map sprite. */
  .face { position: relative; display: inline-block; flex: none; width: 48px; height: 48px; overflow: hidden; border-radius: 8px; line-height: 0;
    border: 1.5px solid var(--line); background: radial-gradient(circle at 50% 30%, var(--ally-bg), var(--night) 85%); vertical-align: middle; }
  .face.red { background: radial-gradient(circle at 50% 30%, var(--foe-bg), var(--night) 85%); }
  .face { --z: 2.6; }
  .face img { position: absolute; max-width: none; width: calc(var(--z) * 100%); left: calc(50% - var(--fx) * var(--z) * 100%); top: calc(50% - var(--fy) * var(--z) * 133.33%); }
  .face.sprite img { width: 175%; left: -37.5%; top: 6%; }
  .face.sprite.red img { transform: scaleX(-1); }
  .face.none { display: none; }
  .face.big { --z: 2.3; width: 76px; height: 76px; border-color: #6a5a3a; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .face.fcface { width: 64px; height: 64px; border-color: currentColor; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .face.card { --z: 2.15; width: 64px; height: 64px; align-self: center; }
  .card .uhead { align-items: center; }
  .face.card.out { filter: grayscale(1) brightness(.7); }
  .face.pair { width: 34px; height: 34px; border-radius: 50%; }
  .face.pair + .face.pair { margin-left: -8px; }
  .face.pick { width: 40px; height: 40px; align-self: center; }
  .face.pick.out { filter: grayscale(1) brightness(.7); }
  .pick .pname:has(.face) { align-items: center; }
  .ucard { display: flex; gap: 12px; align-items: center; margin-bottom: 2px; }
  .ucard .ubody { flex: 1; min-width: 0; }
  .bpair { display: inline-flex; align-items: center; margin-right: 8px; vertical-align: middle; }
  .bhead > span:not(.bpair) { flex: 1; }
  .overlay { position: fixed; inset: 0; z-index: 20; }
  /* Conversation: portraits stand behind the line box; the speaker is lit, the listener dimmed. */
  #dlg { display: flex; align-items: flex-end; justify-content: center; cursor: pointer; overflow: hidden;
    background: linear-gradient(to top, rgba(var(--shade), .92) 0, rgba(var(--shade), .6) 38%, rgba(var(--shade), .45) 100%);
    padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    --ph: min(calc(100vh - 150px), 820px, 132vw); }
  .dlgSlot { position: absolute; bottom: 64px; height: var(--ph); width: calc(var(--ph) * .75); pointer-events: none;
    transition: transform .22s ease-out, opacity .22s ease-out, filter .22s; filter: brightness(.42) saturate(.55); z-index: 0; }
  .dlgSlot.left { left: max(-14vw, calc(50% - 50vw), calc(50% - 560px)); transform-origin: 30% 100%; }
  .dlgSlot.right { right: max(-14vw, calc(50% - 50vw), calc(50% - 560px)); transform-origin: 70% 100%; }
  .dlgSlot img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; display: block;
    filter: drop-shadow(0 0 1px rgba(var(--shade), .9)) drop-shadow(0 10px 24px rgba(0, 0, 0, .55)); }
  .dlgSlot.on { filter: none; z-index: 1; transform: scale(1.02); }
  .dlgSlot:not(.on) { transform: scale(.95) translateY(10px); }
  .dlgSlot.empty { opacity: 0; }
  .dlgSlot.left.empty { transform: translateX(-60px); transition: none; }
  .dlgSlot.right.empty { transform: translateX(60px); transition: none; }

    #dlg { --ph: min(calc(100vh - 170px), 128vw); }
    .dlgSlot { bottom: 90px; }
    .dlgSlot.left { left: -24vw; } .dlgSlot.right { right: -24vw; }
  }
  #dlgBox { position: relative; z-index: 2; width: 100%; max-width: 920px; min-height: 124px; display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(rgba(30, 26, 46, .96), rgba(18, 16, 28, .98)); border: 2px solid var(--gold); border-radius: 8px; padding: 24px 20px 28px;

  #helpBody ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 5px; font-size: 14px; line-height: 1.6; }
  #helpBody li::marker { color: var(--gold); }
  #helpBody b { color: var(--gold); font-weight: normal; }
  #helpBody .tri { font-family: var(--pixel); color: var(--ink); }
  /* Camp merchant: buy / sell / storage tabs and item rows. */
  .shopModes { display: flex; gap: 6px; }
  .shopModes button { flex: 1 1 0; min-height: 40px; padding: 4px 8px; font-size: 14px; }
  .shopModes button[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .sellRow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 40px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 13px; }
  .sellRow .invName { font-family: var(--pixel); font-size: 14px; flex: 1 1 8em; min-width: 0; }
  .sellRow .invName small { color: var(--dim); font-size: 12px; }
  .sellRow button { min-height: 36px; padding: 2px 10px; font-size: 13px; }
  /* 「もどる／選択解除」：地図の操作を1段戻すボタン（行動メニューの中。縦向きスマホと横向きでは先頭に出す）。 */
  #menu button.back { color: var(--dim); border-style: dashed; }
  #menu button.back:hover { color: var(--ink); }
  /* 「撤退する」：待機中の行動メニューの末尾に控えめに（誤操作しにくいよう小さく・薄く。押すと確認が出る）。 */
  #menu button.retreat { flex: 0 1 auto; color: var(--dim); border-style: dashed; font-size: 13px; min-height: 36px; }
  #menu button.retreat:hover { color: var(--ink); }
  @media (max-width: 560px) {
    /* 縦向きスマホ：行動メニューを地図のすぐ下に（情報欄はその下）。スクロールせずに押せる。 */
    #menu { order: -1; gap: 6px; }
    #menu button { flex: 1 1 100px; }
    #menu button.back { order: -1; flex: 0 1 auto; }
  }
  /* ---- スマホ横向き：地図を左に高さいっぱい、右の縦列に HUD・行動メニュー・情報欄。スクロールなしで1画面に収める。 ---- */
  @media (orientation: landscape) and (max-height: 540px) {
    body {
      --pt: max(4px, env(safe-area-inset-top, 0px)); --pb: max(4px, env(safe-area-inset-bottom, 0px));
      --pl: max(8px, env(safe-area-inset-left, 0px)); --pr: max(8px, env(safe-area-inset-right, 0px));
      height: 100vh; height: 100dvh; padding: var(--pt) var(--pr) var(--pb) var(--pl); font-size: 13px; line-height: 1.5; overflow: hidden;
    }
    #app { max-width: none; height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; gap: 5px 10px; }
    #stage { grid-column: 1; grid-row: 1 / -1; align-self: center;
      width: min(calc((100dvh - var(--pt) - var(--pb) - 4px) * 1.5), calc(100vw - var(--pl) - var(--pr) - 10px - 210px)); }
    #hud { grid-column: 2; grid-row: 1; gap: 2px 6px; align-items: center; min-width: 0; }
    #hud { flex-wrap: wrap; }
    #chTitle { font-size: 13px; letter-spacing: .02em; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    #turn { font-size: 11.5px; line-height: 1.3; white-space: nowrap; margin-left: auto; }
    #hud .hudR { display: contents; }
    #hud .hudBreak { display: block; flex-basis: 100%; height: 0; }
    #hud #gridBtn { margin-left: auto; }
    #hud button { min-height: 30px; min-width: 30px; padding: 2px 6px; font-size: 11.5px; }
    #hud .gridBtn span, #hud .sndBtn span { display: none; }
    #hud svg { width: 16px; height: 16px; }
    #speedBtn { min-width: 0; }
    #panel { display: contents; }
    #menu { grid-column: 2; grid-row: 2; flex-direction: row; flex-wrap: wrap; gap: 5px; }
    #menu button { flex: 1 1 72px; min-height: 36px; padding: 3px 6px; font-size: 13px; line-height: 1.25; }
    #menu button.back { order: -1; flex: 1 1 100%; min-height: 32px; }
    #info { grid-column: 2; grid-row: 3; min-height: 0; overflow-y: auto; padding: 6px 8px; overscroll-behavior: contain; }
    #info .face.big { width: 52px; height: 52px; }
    #info .fc .face { display: none; }
    #info .fc { row-gap: 0; }
    .uhead b { font-size: 15px; }
    .stats { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); font-size: 12px; }
    .fc .n { font-size: 14px; }
    .fc .fcwho span { font-size: 13px; }
    /* 勝敗条件・副目標：1行に畳み、タップで開く */
    #goal, #bonusGoal { grid-column: 2; font-size: 11.5px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    #goal { grid-row: 4; } #bonusGoal { grid-row: 5; margin: 0; }
    #goal::before { content: "▸ "; color: var(--gold); }
    #app.goalsOpen #goal, #app.goalsOpen #bonusGoal { white-space: normal; }
    #app.goalsOpen #goal::before { content: "▾ "; }
    #tut { font-size: 12.5px; padding: 6px 10px; gap: 4px; left: 6px; right: 6px; top: 6px; }
    #tut.low { bottom: 6px; }
    #tut .tutBtns button { min-height: 32px; }
    #rushBtn { min-height: 32px; }
    #banner { top: 34%; }
    /* タイトル・難易度：縦に収まらないときはスクロール（上下が切れない） */
    #title { justify-content: safe center; overflow-y: auto; gap: 8px; padding-block: 10px; }
    #star { margin-bottom: 4px; width: 10px; height: 10px; }
    #title h1 { font-size: clamp(24px, 7vh, 40px); }
    #title p { font-size: 13px; }
    #title .btns { margin-top: 4px; gap: 8px; }
    #title .btns button { min-height: 40px; }
    #title #diffPick { width: min(640px, 100%); display: grid; grid-template-columns: 1fr 1fr; }
    #diffPick > .levelPick, #diffPick > small, #diffPick > #btnDiffBack { grid-column: 1 / -1; }
    /* 章間・出撃準備：下のボタンを常に見えるように */
    #camp { padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: 0; }
    .campIn { max-width: 860px; gap: 6px; }
    .campBtns { position: sticky; bottom: 0; z-index: 2; background: linear-gradient(rgba(20, 18, 28, 0), var(--night) 8px); padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px)); margin-top: 0; }
    .campBtns button { min-height: 40px; }
    .prepBtns { position: sticky; bottom: 0; z-index: 2; background: linear-gradient(rgba(20, 18, 28, 0), var(--night) 8px); padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px)); }
    #campTabs button { min-height: 38px; }
    /* 会話：立ち絵と台詞枠を低い画面に合わせる */
    #dlg { --ph: min(calc(100vh - 40px), 132vw); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .dlgSlot { bottom: 0; }
    .dlgSlot.left { left: max(-6vw, calc(50% - 560px)); } .dlgSlot.right { right: max(-6vw, calc(50% - 560px)); }
    #dlgBox { min-height: 0; padding: 18px 16px 20px; max-width: min(760px, 100%); }
    #dlgFace { width: 56px; height: 56px; }
    #dlgText { font-size: 15px; line-height: 1.7; }
    #dlgCg { top: max(8px, env(safe-area-inset-top, 0px)); width: min(calc(100% - 24px), calc((100vh - 150px) * 16 / 9)); }
    #dlgChoice { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
    #dlgChoice button { min-height: 42px; font-size: 15px; }
    #dlg.mono #dlgBox { min-height: 0; }
    /* 見せ場：絵を上、帯を下寄りに */
    #show .shPics { top: 4%; height: 58%; }
    #show.boss .shPics { top: 0; height: 66%; }
    #show .shBand { top: 64%; padding: 8px 16px 10px; }
    #show.boss .shBand { top: 66%; }
    #show .shRing { top: 40%; }
    #help, #snd { padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
    .helpHead { position: sticky; top: 0; background: #262238; z-index: 1; padding-block: 4px; }
  }
</style>
