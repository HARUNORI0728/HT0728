<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Zoom背景｜HAL経営相談室</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 1920×1080 の Zoom バーチャル背景。render.js で各 .bg を PNG に書き出す。
   人物が入る中央〜下中央は空け、文字は上部の左右端に置く。 */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Noto Sans JP",sans-serif}
.bg{width:1920px;height:1080px;position:relative;overflow:hidden;margin:0 auto 40px}
.light{--paper:#fbf9f4;--paper2:#efe7d6;--ink:#141b2e;--sub:#5b6175;--gold:#a8833a;--gold2:#8f6d2c;--line:rgba(168,131,58,.55);--line2:rgba(20,27,46,.16)}
.navy{--paper:#1b2440;--paper2:#0f1424;--ink:#f4efe4;--sub:#b9bccb;--gold:#c9a45a;--gold2:#e3c98f;--line:rgba(201,164,90,.55);--line2:rgba(244,239,228,.14)}
.bg{color:var(--ink)}
.mark svg{display:block;width:100%;height:100%;overflow:visible}
.mark .c,.mark .o{fill:none;stroke:var(--gold)}
.mark .h{fill:var(--ink)}
.mark .d{fill:var(--gold)}
.orb ellipse{fill:none;stroke-width:1.6}
.orb .g{stroke:var(--line)} .orb .n{stroke:var(--line2)}
.orb .dot{fill:var(--gold)}
.serif{font-family:"Noto Serif JP",serif}
.play{font-family:"Playfair Display",serif}
em{font-style:normal;color:var(--gold)}

/* 共通：屋号ブロック */
.brand{display:flex;align-items:center;gap:26px}
.brand .mark{width:112px;height:112px}
.brand b{display:block;font-family:"Noto Serif JP",serif;font-weight:600;font-size:46px;letter-spacing:.14em;line-height:1.25}
.brand i{display:block;font-style:normal;font-family:"Playfair Display",serif;font-size:19px;letter-spacing:.36em;color:var(--gold);margin-top:6px}

/* ---------- A 書斎 ---------- */
.a{background:
  radial-gradient(900px 700px at 14% 6%,rgba(255,255,255,.9),transparent 70%),
  linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%)}
.a.navy{background:
  radial-gradient(900px 700px at 14% 6%,rgba(201,164,90,.16),transparent 70%),
  linear-gradient(180deg,#1d2744 0%,#121a30 100%)}
.a .panel{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 238px,var(--line2) 238px 240px);opacity:.55;
  -webkit-mask:linear-gradient(90deg,#000 0,transparent 26%,transparent 74%,#000 100%);mask:linear-gradient(90deg,#000 0,transparent 26%,transparent 74%,#000 100%)}
.a .wain{position:absolute;left:0;right:0;top:760px;bottom:0;background:linear-gradient(180deg,rgba(20,27,46,.06),rgba(20,27,46,.12));border-top:2px solid var(--line)}
.a.navy .wain{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.32))}
.a .orb{position:absolute;right:-300px;top:-330px;width:1150px;height:1150px}
.a .brand{position:absolute;left:96px;top:84px}
.a .who{position:absolute;left:96px;top:236px;padding-left:138px}
.a .who p{font-size:26px;letter-spacing:.14em;color:var(--sub)}
.a .who p b{font-family:"Noto Serif JP",serif;font-weight:600;font-size:46px;letter-spacing:.22em;color:var(--ink);margin-left:18px;vertical-align:-4px}

/* ---------- B 夜の軌道 ---------- */
.b{background:
  radial-gradient(1100px 620px at 50% -8%,rgba(201,164,90,.22),transparent 70%),
  radial-gradient(1400px 900px at 50% 120%,#0a0e1a,transparent 70%),
  linear-gradient(180deg,#1a2340 0%,#10172b 100%)}
.b.light{background:
  radial-gradient(1100px 620px at 50% -8%,rgba(227,201,143,.45),transparent 70%),
  linear-gradient(180deg,#fbf9f4 0%,#f0e8d8 100%)}
.b .orb{position:absolute;left:-160px;top:-560px;width:2240px;height:1200px}
.b .orb ellipse{stroke-width:2}
.b .glow{filter:blur(10px);opacity:.9}
.b .stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px 3px rgba(227,201,143,.55)}
.b.light .stars i{background:var(--gold);box-shadow:0 0 10px 2px rgba(168,131,58,.35)}
.b .brand{position:absolute;left:96px;top:84px}
.b .copy{position:absolute;right:96px;top:96px;text-align:right}
.b .copy p{font-family:"Noto Serif JP",serif;font-weight:500;font-size:44px;letter-spacing:.16em}
.b .copy small{display:block;margin-top:14px;font-size:24px;letter-spacing:.14em;color:var(--sub)}
.b .copy small b{font-family:"Noto Serif JP",serif;font-weight:600;font-size:40px;letter-spacing:.22em;color:var(--ink);margin-left:14px;vertical-align:-3px}

/* ---------- C 名刺型 ---------- */
.c{background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%)}
.c.navy{background:radial-gradient(1000px 600px at 50% 0%,rgba(201,164,90,.14),transparent 70%),linear-gradient(180deg,#1b2440 0%,#10172b 100%)}
.c .orb{position:absolute;left:50%;top:-420px;width:1500px;height:1000px;transform:translateX(-50%);opacity:.6}
.c .card{position:absolute;left:84px;top:72px;padding:44px 52px 44px;background:rgba(255,255,255,.62);border-radius:10px;box-shadow:0 18px 40px -22px rgba(20,27,46,.45);border-top:4px solid var(--gold)}
.c.navy .card{background:rgba(255,255,255,.05);box-shadow:0 18px 40px -22px rgba(0,0,0,.7)}
.c .brand .mark{width:88px;height:88px}
.c .brand b{font-size:36px}
.c .brand i{font-size:15px}
.c .role{margin-top:30px;font-size:25px;letter-spacing:.12em;line-height:1.6}
.c .role em{display:block}
.c .name{font-family:"Noto Serif JP",serif;font-weight:600;font-size:62px;letter-spacing:.24em;line-height:1.2;margin-top:6px}
.c .roman{font-family:"Playfair Display",serif;font-size:19px;letter-spacing:.4em;color:var(--sub);margin-top:6px}
.c .right{position:absolute;right:84px;top:84px;display:flex;flex-direction:column;align-items:flex-end;gap:26px}
.c .copy{font-family:"Noto Serif JP",serif;font-weight:500;font-size:38px;letter-spacing:.16em}
.c .tags{display:flex;gap:12px}
.c .tags span{font-size:22px;letter-spacing:.1em;padding:8px 18px;border:1.5px solid var(--line);border-radius:999px;color:var(--ink)}
.c .qrrow{display:flex;align-items:flex-end;gap:20px;margin-top:6px}
.c .qrrow small{text-align:right;font-size:21px;line-height:1.6;letter-spacing:.06em;color:var(--sub)}
.c .qrrow small i{display:block;font-style:normal;font-family:"Playfair Display",serif;font-size:17px;letter-spacing:.3em;color:var(--gold)}
.c .qrbox{position:relative;width:176px;height:176px;padding:14px;background:#fff;border-radius:8px}
.c .qrbox .qr{display:block;width:100%;height:100%}
.c .kari{position:absolute;right:-14px;top:-14px;background:#b8432e;color:#fff;font-size:20px;font-weight:500;padding:4px 12px;border-radius:6px;letter-spacing:.1em}

/* ---------- D シンプル ---------- */
.d{background:
  radial-gradient(1000px 760px at 50% 62%,rgba(255,255,255,.95),transparent 70%),
  linear-gradient(180deg,#f7f3ea 0%,#ebe2d0 100%)}
.d.navy{background:
  radial-gradient(1000px 760px at 50% 62%,rgba(201,164,90,.20),transparent 70%),
  linear-gradient(180deg,#1a2340 0%,#0f1528 100%)}
.d .orb{position:absolute;left:50%;top:50%;width:2100px;height:2100px;transform:translate(-50%,-44%);opacity:.5}
.d .mk{position:absolute;right:104px;top:84px;display:flex;flex-direction:column;align-items:center;gap:16px}
.d .mk .mark{width:150px;height:150px}
.d .mk b{font-family:"Noto Serif JP",serif;font-weight:600;font-size:30px;letter-spacing:.2em;padding-left:.2em}

/* ---------- E 採用案：Dの背景＋Aの名前配置 ---------- */
.e{background:
  radial-gradient(1000px 760px at 50% 62%,rgba(255,255,255,.95),transparent 70%),
  linear-gradient(180deg,#f7f3ea 0%,#ebe2d0 100%)}
.e.navy{background:
  radial-gradient(1000px 760px at 50% 62%,rgba(150,168,214,.18),transparent 70%),
  linear-gradient(180deg,#1a2340 0%,#0f1528 100%)}
.e .orb{position:absolute;left:50%;top:50%;width:2100px;height:2100px;transform:translate(-45%,-40%);opacity:.5}
.e .brand{position:absolute;left:96px;top:84px}
.e .who{position:absolute;left:96px;top:236px;padding-left:138px}
.e .who p{font-size:26px;letter-spacing:.14em;color:var(--sub)}
.e .who p b{font-family:"Noto Serif JP",serif;font-weight:600;font-size:46px;letter-spacing:.22em;color:var(--ink);margin-left:18px;vertical-align:-4px}

/* ---------- F オフィス風（図形で描いた室内をぼかす。写真素材は不使用） ---------- */
.f .scene{position:absolute;inset:-30px}
.f .scene svg{width:100%;height:100%;display:block;filter:blur(5px) saturate(.95)}
.f .veil{position:absolute;inset:0;background:radial-gradient(900px 520px at 16% 10%,rgba(251,249,244,.86),rgba(251,249,244,.45) 55%,transparent 80%)}
.f.navy .veil{background:radial-gradient(900px 520px at 16% 10%,rgba(16,22,40,.82),rgba(16,22,40,.4) 55%,transparent 80%)}
.f .brand{position:absolute;left:96px;top:84px}
.f .who{position:absolute;left:96px;top:236px;padding-left:138px}
.f .who p{font-size:26px;letter-spacing:.14em;color:var(--sub)}
.f .who p b{font-family:"Noto Serif JP",serif;font-weight:600;font-size:46px;letter-spacing:.22em;color:var(--ink);margin-left:18px;vertical-align:-4px}

.tag{position:absolute;left:24px;bottom:16px;font-size:14px;color:rgba(0,0,0,.25)}
</style>
</head>
