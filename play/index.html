<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>フィットア奪還戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* Layout: one column — status line, map, then an info/command panel; dialogue and title sit on top as overlays. */
  :root {
    color-scheme: dark;
    --night: #14121c; --panel: #1d1a2a; --line: #3a3350; --ink: #f1e9d2; --dim: #a79fb8;
    --gold: #e8c56a; --ally: #8fc1ff; --foe: #ff9a8f; --rose: #ff8fa8; --heal: #8fe0a0;
    --pixel: "DotGothic16", "IPAGothic", "MS Gothic", monospace;
    --text: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  #app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #hud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--pixel); }
  #chTitle { color: var(--gold); font-size: 18px; letter-spacing: .06em; }
  #turn { color: var(--dim); font-size: 14px; }
  #turn b { font-weight: normal; }
  #turn b.blue { color: var(--ally); } #turn b.red { color: var(--foe); }
  #stage { position: relative; border: 3px solid var(--line); border-radius: 4px; overflow: hidden; line-height: 0; }
  #cv { width: 100%; height: auto; image-rendering: pixelated; display: block; cursor: pointer; touch-action: manipulation; }
  #banner {
    position: absolute; left: 0; right: 0; top: 38%; padding: 14px 8px; text-align: center; line-height: 1.5;
    background: rgba(20, 18, 28, .9); border-block: 2px solid var(--gold); color: var(--gold);
    font-family: var(--pixel); font-size: clamp(16px, 4.5vw, 24px); letter-spacing: .12em; pointer-events: none;
  }
  #panel { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; align-items: start; }
  #info { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 10px 12px; min-height: 132px; min-width: 0; }
  #menu { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 560px) {
    #panel { grid-template-columns: minmax(0, 1fr); }
    #menu { flex-direction: row; flex-wrap: wrap; }
    #menu button { flex: 1 1 130px; }
  }
  button {
    font: inherit; font-family: var(--pixel); font-size: 15px; color: var(--ink); background: var(--panel);
    border: 2px solid var(--line); border-radius: 4px; min-height: 44px; padding: 6px 12px; cursor: pointer; text-align: center;
  }
  button:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  #goal { margin: 0; color: var(--dim); font-size: 12.5px; }
  .hint { color: var(--dim); margin: 0; }
  .uhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--pixel); }
  .uhead b { font-size: 17px; font-weight: normal; }
  .blue { color: var(--ally); } .red { color: var(--foe); }
  .uhead span { color: var(--dim); font-size: 13px; }
  .hp { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; margin: 4px 0 6px; }
  .bar { flex: 1; height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 0 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--dim); margin-right: 6px; }
  .wps { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .fc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 12px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--pixel); }
  .fc .k { color: var(--gold); font-size: 12px; align-self: center; }
  .fc .n { font-size: 16px; }
  .overlay { position: fixed; inset: 0; z-index: 20; }
  #dlg { display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 9, 16, .55); cursor: pointer;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #dlgBox { position: relative; width: 100%; max-width: 720px; min-height: 150px; display: flex; gap: 14px; align-items: flex-start;
    background: rgba(24, 21, 36, .97); border: 2px solid var(--gold); border-radius: 6px; padding: 22px 16px 26px; }
  #dlgFace { width: 80px; height: 80px; flex: none; image-rendering: pixelated; background: var(--night); border: 2px solid var(--line); border-radius: 4px; }
  #dlgName { position: absolute; top: -15px; left: 14px; font-family: var(--pixel); font-size: 14px; background: #274a8c; border: 2px solid var(--gold); border-radius: 4px; padding: 0 14px; }
  #dlgText { font-size: 16px; line-height: 1.8; min-width: 0; }
  #dlgBox.narr #dlgText { color: var(--dim); }
  #dlgNext { position: absolute; right: 14px; bottom: 6px; color: var(--gold); font-size: 12px; animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { #dlgNext { animation: none; } }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: radial-gradient(circle at 50% 24%, #2c4a8a 0, #1b1f3d 22%, var(--night) 60%);
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  #star { width: 14px; height: 14px; background: #cfe6ff; transform: rotate(45deg); box-shadow: 0 0 24px 8px #6fa8ff; margin-bottom: 18px; }
  #title h1 { font-family: var(--pixel); font-weight: normal; font-size: clamp(30px, 9vw, 54px); letter-spacing: .14em; margin: 0; color: var(--ink); text-wrap: balance; }
  #title p { margin: 0; color: var(--dim); max-width: 34em; }
  #titleMsg { color: var(--gold); font-family: var(--pixel); }
  #title .btns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); margin-top: 14px; }
  .bondl { font-size: 13px; margin-top: 4px; color: var(--ink); }
  .bondl span { color: var(--dim); margin-right: 8px; }
  .bondl b { color: var(--rose); font-weight: normal; font-family: var(--pixel); }
  .bondl em { color: var(--rose); font-style: normal; }
  .fcsup { margin: 6px 0 0; font-size: 12.5px; color: var(--rose); text-align: center; }
  button:disabled { opacity: .5; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  #camp { overflow-y: auto; background: var(--night); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .campIn { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #campTitle { font-family: var(--pixel); font-weight: normal; color: var(--gold); font-size: 20px; letter-spacing: .08em; margin: 0; }
  #campMsg { margin: 0; color: var(--gold); font-family: var(--pixel); min-height: 1.6em; }
  #campTabs { display: flex; gap: 8px; }
  #campTabs button { flex: 1 1 0; }
  #campTabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
  #campBody { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .card p { margin: 0; }
  .card > button { align-self: flex-start; }
  .gold { color: var(--gold); font-weight: normal; }
  .pdesc { color: var(--ink); font-size: 14px; }
  .pgain { color: var(--heal); font-size: 13px; }
  .bhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--pixel); }
  .bhead small { color: var(--dim); font-size: 12px; }
  .bond .hp { margin: 0; }
  .bond .hp span { color: var(--dim); white-space: nowrap; }
  .rank { color: var(--rose); font-size: 20px; font-weight: normal; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button, .campBtns button { flex: 1 1 140px; }
  .campBtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
</style>

<main id="app">
  <header id="hud"><span id="chTitle"></span><span id="turn"></span></header>
  <div id="stage"><canvas id="cv" width="720" height="480"></canvas><div id="banner" hidden></div></div>
  <section id="panel"><div id="info"></div><div id="menu"></div></section>
  <p id="goal"></p>
</main>

<div id="camp" class="overlay" hidden>
  <div class="campIn">
    <h2 id="campTitle">章間</h2>
    <p id="campMsg" role="status"></p>
    <div id="campTabs" role="tablist">
      <button data-tab="units" role="tab">部隊</button>
      <button data-tab="bonds" role="tab">支援</button>
    </div>
    <div id="campBody"></div>
    <div class="campBtns">
      <button id="btnNext" class="primary">次の章へ</button>
      <button id="btnToTitle">タイトルへ</button>
    </div>
  </div>
</div>

<div id="dlg" class="overlay" hidden>
  <div id="dlgBox">
    <canvas id="dlgFace" width="96" height="96"></canvas>
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgNext">▼ タップで次へ</div>
  </div>
</div>

<div id="title" class="overlay">
  <div id="star"></div>
  <h1>フィットア奪還戦記</h1>
  <p>『無職転生』の非公式ファンゲーム（個人で遊ぶ用）。消えた故郷を、仲間と取り戻す。</p>
  <p id="titleMsg"></p>
  <div class="btns">
    <button id="btnNew" class="primary">はじめから</button>
    <button id="btnLoad" hidden>つづきから</button>
  </div>
</div>
