<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>フィットア奪還戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* Layout: one column — status line, map, then an info/command panel; dialogue and title sit on top as overlays. */
  :root {
    color-scheme: dark;
    --night: #14121c; --panel: #1d1a2a; --line: #3a3350; --ink: #f1e9d2; --dim: #a79fb8;
    --gold: #e8c56a; --ally: #8fc1ff; --foe: #ff9a8f; --rose: #ff8fa8; --heal: #8fe0a0;
    --ally-deep: #274a8c; --foe-deep: #8a2f3c; --ally-bg: #2c3f6a; --foe-bg: #5a2632; --shade: 10, 9, 16;
    --pixel: "DotGothic16", "IPAGothic", "MS Gothic", monospace;
    --text: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  #app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #hud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--pixel); }
  #chTitle { color: var(--gold); font-size: 18px; letter-spacing: .06em; }
  #turn { color: var(--dim); font-size: 14px; }
  #turn b { font-weight: normal; }
  #turn b.blue { color: var(--ally); } #turn b.red { color: var(--foe); }
  #stage { position: relative; border: 2px solid #6a5a3a; border-radius: 8px; overflow: hidden; line-height: 0; box-shadow: 0 0 0 1px #0008, 0 6px 18px #0008; }
  #cv { width: 100%; height: auto; display: block; cursor: pointer; touch-action: manipulation; background: #14121c; }
  #banner {
    position: absolute; left: 0; right: 0; top: 38%; padding: 14px 8px; text-align: center; line-height: 1.5;
    background: linear-gradient(90deg, #18152400, #262238ee 18%, #181524ee 82%, #18152400); border-block: 1.5px solid var(--gold); color: var(--gold);
    text-shadow: 0 0 12px #e8c56a88;
    font-family: var(--pixel); font-size: clamp(16px, 4.5vw, 24px); letter-spacing: .12em; pointer-events: none;
  }
  /* Battle cut-in: the two fighters slide in from their sides over a dark band (about half a second). */
  #cutin { position: absolute; inset: 0; pointer-events: none; overflow: hidden; line-height: 0; }
  #cutin .ciband { position: absolute; left: -10%; right: -10%; top: 18%; height: 64%; transform: skewY(-6deg);
    background: linear-gradient(90deg, rgba(var(--shade), .55), rgba(var(--shade), .82) 30%, rgba(var(--shade), .82) 70%, rgba(var(--shade), .55));
    border-block: 2px solid var(--gold); box-shadow: 0 0 24px rgba(0, 0, 0, .6); opacity: 0; }
  #cutin .ci { position: absolute; bottom: 0; height: 100%; width: 75%; max-width: 50%; opacity: 0; }
  #cutin .ci img { height: 100%; width: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 0 2px rgba(var(--shade), .9)) brightness(.5) saturate(.6); }
  #cutin .ci.att img { filter: drop-shadow(0 0 2px rgba(var(--shade), .9)) drop-shadow(0 0 14px rgba(232, 197, 106, .45)); }
  #cutin .ci.sprite { height: 78%; bottom: 8%; }
  #cutin .ci.r.sprite img { transform: scaleX(-1); }
  #cutin .ci.l { left: 0; object-position: 0 100%; } #cutin .ci.r { right: 0; }
  #cutin.go .ciband { animation: ciBand .56s ease-out both; }
  #cutin.go .ci.l { animation: ciInL .56s cubic-bezier(.2, .8, .3, 1) both; }
  #cutin.go .ci.r { animation: ciInR .56s cubic-bezier(.2, .8, .3, 1) both; }
  @keyframes ciBand { 0% { opacity: 0; transform: skewY(-6deg) scaleY(.2); } 18% { opacity: 1; transform: skewY(-6deg) scaleY(1); } 82% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes ciInL { 0% { opacity: 0; transform: translateX(-45%); } 22% { opacity: 1; transform: translateX(0); } 80% { opacity: 1; transform: translateX(3%); } 100% { opacity: 0; transform: translateX(6%); } }
  @keyframes ciInR { 0% { opacity: 0; transform: translateX(45%); } 22% { opacity: 1; transform: translateX(0); } 80% { opacity: 1; transform: translateX(-3%); } 100% { opacity: 0; transform: translateX(-6%); } }
  #cutin .cicrit { position: absolute; top: 50%; left: 0; right: 0; text-align: center; line-height: 1; font-family: var(--pixel); color: var(--gold);
    font-size: clamp(26px, 9vw, 64px); letter-spacing: .2em; text-shadow: 0 0 18px #e8c56acc, 0 3px 0 #000a; opacity: 0; transform: translateY(-50%); }
  #cutin.crit .ci { width: 100%; max-width: 70%; }
  #cutin.crit[data-att="l"] .ci.l { left: 0; } #cutin.crit[data-att="r"] .ci.r { right: 0; }
  #cutin.crit .ciband { background: linear-gradient(90deg, rgba(120, 70, 10, .6), rgba(var(--shade), .85) 40%, rgba(120, 70, 10, .6)); border-width: 3px; }
  #cutin.crit.go .ci { animation-duration: .72s; } #cutin.crit.go .ciband { animation-duration: .72s; }
  #cutin.crit.go .cicrit { animation: ciCrit .72s ease-out both; }
  #cutin.crit.go::after { content: ''; position: absolute; inset: 0; background: #fff; animation: ciFlash .72s ease-out both; }
  #cutin.crit[data-att="l"] .cicrit { padding-left: 38%; } #cutin.crit[data-att="r"] .cicrit { padding-right: 38%; }
  @keyframes ciCrit { 0%, 15% { opacity: 0; transform: translateY(-50%) scale(1.8); } 30% { opacity: 1; transform: translateY(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes ciFlash { 0% { opacity: .85; } 25% { opacity: 0; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #cutin.go .ci, #cutin.go .ciband, #cutin.go .cicrit { animation-duration: .01s; } #cutin.crit.go::after { display: none; } }
  #panel { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; align-items: start; }
  #info { background: linear-gradient(#262238, #1b1828); border: 1.5px solid #4a4060; border-radius: 8px; box-shadow: 0 4px 14px #0006; padding: 10px 12px; min-height: 132px; min-width: 0; }
  #menu { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 560px) {
    #panel { grid-template-columns: minmax(0, 1fr); }
    #menu { flex-direction: row; flex-wrap: wrap; }
    #menu button { flex: 1 1 130px; }
  }
  button {
    font: inherit; font-family: var(--pixel); font-size: 15px; color: var(--ink); background: var(--panel);
    border: 2px solid var(--line); border-radius: 4px; min-height: 44px; padding: 6px 12px; cursor: pointer; text-align: center;
  }
  button:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  #goal { margin: 0; color: var(--dim); font-size: 12.5px; }
  .hint { color: var(--dim); margin: 0; }
  .uhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--pixel); }
  .uhead b { font-size: 17px; font-weight: normal; }
  .blue { color: var(--ally); } .red { color: var(--foe); }
  .uhead span { color: var(--dim); font-size: 13px; }
  .hp { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; margin: 4px 0 6px; }
  .bar { flex: 1; height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 0 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--dim); margin-right: 6px; }
  .wps { font-size: 13px; color: var(--dim); margin-top: 4px; }
  .fc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 12px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--pixel); }
  .fc .k { color: var(--gold); font-size: 12px; align-self: center; }
  .fc .n { font-size: 16px; }
  .fc .fcwho { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .fc .fcwho span { font-size: 15px; overflow-wrap: anywhere; line-height: 1.3; }
  .fc .k.vs { font-size: 15px; letter-spacing: .1em; text-shadow: 0 0 10px #e8c56a88; }
  /* Face badges: the portrait cropped around the face (--fx/--fy = face centre), or the top of the map sprite. */
  .face { position: relative; display: inline-block; flex: none; width: 48px; height: 48px; overflow: hidden; border-radius: 8px; line-height: 0;
    border: 1.5px solid var(--line); background: radial-gradient(circle at 50% 30%, var(--ally-bg), var(--night) 85%); vertical-align: middle; }
  .face.red { background: radial-gradient(circle at 50% 30%, var(--foe-bg), var(--night) 85%); }
  .face { --z: 2.6; }
  .face img { position: absolute; max-width: none; width: calc(var(--z) * 100%); left: calc(50% - var(--fx) * var(--z) * 100%); top: calc(50% - var(--fy) * var(--z) * 133.33%); }
  .face.sprite img { width: 175%; left: -37.5%; top: 6%; }
  .face.sprite.red img { transform: scaleX(-1); }
  .face.none { display: none; }
  .face.big { --z: 2.3; width: 76px; height: 76px; border-color: #6a5a3a; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .face.fcface { width: 64px; height: 64px; border-color: currentColor; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .face.card { --z: 2.15; width: 64px; height: 64px; align-self: center; }
  .card .uhead { align-items: center; }
  .face.card.out { filter: grayscale(1) brightness(.7); }
  .face.pair { width: 34px; height: 34px; border-radius: 50%; }
  .face.pair + .face.pair { margin-left: -8px; }
  .face.pick { width: 40px; height: 40px; align-self: center; }
  .face.pick.out { filter: grayscale(1) brightness(.7); }
  .pick .pname:has(.face) { align-items: center; }
  .ucard { display: flex; gap: 12px; align-items: center; margin-bottom: 2px; }
  .ucard .ubody { flex: 1; min-width: 0; }
  .bpair { display: inline-flex; align-items: center; margin-right: 8px; vertical-align: middle; }
  .bhead > span:not(.bpair) { flex: 1; }
  .overlay { position: fixed; inset: 0; z-index: 20; }
  /* Conversation: portraits stand behind the line box; the speaker is lit, the listener dimmed. */
  #dlg { display: flex; align-items: flex-end; justify-content: center; cursor: pointer; overflow: hidden;
    background: linear-gradient(to top, rgba(var(--shade), .92) 0, rgba(var(--shade), .6) 38%, rgba(var(--shade), .45) 100%);
    padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    --ph: min(calc(100vh - 150px), 820px, 132vw); }
  .dlgSlot { position: absolute; bottom: 64px; height: var(--ph); width: calc(var(--ph) * .75); pointer-events: none;
    transition: transform .22s ease-out, opacity .22s ease-out, filter .22s; filter: brightness(.42) saturate(.55); z-index: 0; }
  .dlgSlot.left { left: max(-14vw, calc(50% - 50vw), calc(50% - 560px)); transform-origin: 30% 100%; }
  .dlgSlot.right { right: max(-14vw, calc(50% - 50vw), calc(50% - 560px)); transform-origin: 70% 100%; }
  .dlgSlot img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; display: block;
    filter: drop-shadow(0 0 1px rgba(var(--shade), .9)) drop-shadow(0 10px 24px rgba(0, 0, 0, .55)); }
  .dlgSlot.on { filter: none; z-index: 1; transform: scale(1.02); }
  .dlgSlot:not(.on) { transform: scale(.95) translateY(10px); }
  .dlgSlot.empty { opacity: 0; }
  .dlgSlot.left.empty { transform: translateX(-60px); transition: none; }
  .dlgSlot.right.empty { transform: translateX(60px); transition: none; }
  @media (max-width: 560px) {
    #dlg { --ph: min(calc(100vh - 170px), 128vw); }
    .dlgSlot { bottom: 90px; }
    .dlgSlot.left { left: -24vw; } .dlgSlot.right { right: -24vw; }
  }
  #dlgBox { position: relative; z-index: 2; width: 100%; max-width: 920px; min-height: 124px; display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(rgba(30, 26, 46, .96), rgba(18, 16, 28, .98)); border: 2px solid var(--gold); border-radius: 8px; padding: 24px 20px 28px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 -6px 30px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .08); }
  #dlgFace { width: 80px; height: 80px; flex: none; background: radial-gradient(circle at 50% 35%, #3d5a8c, #1b1f3d 75%); border: 1.5px solid var(--gold); border-radius: 8px; }
  #dlgName { position: absolute; top: -17px; left: 18px; font-family: var(--pixel); font-size: 16px; letter-spacing: .06em; background: var(--ally-deep);
    border: 2px solid var(--gold); border-radius: 4px; padding: 1px 16px; box-shadow: 0 3px 10px rgba(0, 0, 0, .5); }
  #dlgBox[data-side="right"] #dlgName { left: auto; right: 18px; }
  #dlgBox.foe #dlgName { background: var(--foe-deep); }
  #dlgText { font-size: 17px; line-height: 1.85; min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  @media (max-width: 560px) { #dlgText { font-size: 15.5px; } #dlgBox { padding: 22px 14px 26px; min-height: 128px; } }
  #dlgBox.narr #dlgText { color: var(--dim); }
  #dlgNext { position: absolute; right: 14px; bottom: 6px; color: var(--gold); font-size: 12px; animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { #dlgNext { animation: none; } }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: radial-gradient(circle at 50% 24%, #2c4a8a 0, #1b1f3d 22%, var(--night) 60%);
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  #star { width: 14px; height: 14px; background: #cfe6ff; transform: rotate(45deg); box-shadow: 0 0 24px 8px #6fa8ff; margin-bottom: 18px; }
  #title h1 { font-family: var(--pixel); font-weight: normal; font-size: clamp(30px, 9vw, 54px); letter-spacing: .14em; margin: 0; color: var(--ink); text-wrap: balance; }
  #title p { margin: 0; color: var(--dim); max-width: 34em; }
  #titleMsg { color: var(--gold); font-family: var(--pixel); }
  #title .btns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); margin-top: 14px; }
  .bondl { font-size: 13px; margin-top: 4px; color: var(--ink); }
  .bondl span { color: var(--dim); margin-right: 8px; }
  .bondl b { color: var(--rose); font-weight: normal; font-family: var(--pixel); }
  .bondl em { color: var(--rose); font-style: normal; }
  .fcsup { margin: 6px 0 0; font-size: 12.5px; color: var(--rose); text-align: center; }
  button:disabled { opacity: .5; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  #camp { overflow-y: auto; background: var(--night); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .campIn { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #campTitle { font-family: var(--pixel); font-weight: normal; color: var(--gold); font-size: 20px; letter-spacing: .08em; margin: 0; }
  #campMsg { margin: 0; color: var(--gold); font-family: var(--pixel); min-height: 1.6em; }
  #campTabs { display: flex; gap: 8px; }
  #campTabs button { flex: 1 1 0; }
  #campTabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
  #campBody { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .uicon { width: 48px; height: 48px; flex: none; align-self: center; background: radial-gradient(circle at 50% 40%, #2c3f6a, #1b1f3d 80%); border: 1px solid var(--line); border-radius: 8px; }
  .uicon.out { filter: grayscale(1) brightness(.7); }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .card p { margin: 0; }
  .card > button { align-self: flex-start; }
  .gold { color: var(--gold); font-weight: normal; }
  .pdesc { color: var(--ink); font-size: 14px; }
  .pgain { color: var(--heal); font-size: 13px; }
  .bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--pixel); }
  .bhead small { color: var(--dim); font-size: 12px; }
  .bond .hp { margin: 0; }
  .bond .hp span { color: var(--dim); white-space: nowrap; }
  .rank { color: var(--rose); font-size: 20px; font-weight: normal; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button, .campBtns button { flex: 1 1 140px; }
  .campBtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  #title .btns.wide { width: min(360px, 100%); }
  button.diff { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 8px 12px; }
  button.diff b { font-weight: normal; color: var(--gold); font-size: 16px; }
  button.diff small { font-family: var(--text); font-size: 12.5px; color: var(--dim); line-height: 1.5; }
  .heal { color: var(--heal); }
  .card.out { border-style: dashed; }
  .card.out .uhead b { color: var(--dim); }
  .outTag { color: var(--foe); font-style: normal; font-size: 12.5px; }
  .prepCount { margin: 0; font-family: var(--pixel); color: var(--dim); }
  .prepCount b { color: var(--gold); font-weight: normal; font-size: 18px; }
  .prepHead { margin: 6px 0 0; font-family: var(--pixel); font-weight: normal; font-size: 15px; color: var(--gold); }
  .pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: left; width: 100%;
    background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 8px 12px; min-height: 44px; font-family: var(--text); }
  .pick .pname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; font-family: var(--pixel); }
  .pick .pname b { font-weight: normal; font-size: 16px; color: var(--ally); }
  .pick .pname span { color: var(--dim); font-size: 13px; }
  .pick small { grid-column: 1; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .pick em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-family: var(--pixel); font-size: 14px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  .pick.fixed em { color: var(--gold); border-color: var(--gold); }
  .pick[aria-pressed="true"] { border-color: var(--gold); }
  .pick[aria-pressed="true"] em { color: var(--night); background: var(--gold); border-color: var(--gold); }
  .pick.out { border-style: dashed; }
  .pick.out .pname b { color: var(--dim); }
  .pick.out em { color: var(--foe); border-color: var(--foe); }
  /* Skip: ends the whole conversation. */
  #dlgSkip { position: absolute; z-index: 3; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    min-height: 36px; padding: 4px 12px; font-size: 13px; background: var(--panel); border-color: var(--line); color: var(--dim); box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  /* Extras without a portrait (ハンナ, トト …): a plain name tag. Unnamed enemies (野盗) use the enemy tag. */
  #dlgBox.npc #dlgName { background: var(--panel); border-color: var(--dim); color: var(--ink); }
  #dlgBox.thought #dlgText { color: #cfdcff; }
  #dlgBox.narr #dlgText { color: var(--gold); opacity: .92; }
  /* 序章: a monologue on a dark screen, lines centred and fading in, no portraits or name tags. */
  #dlg.mono { align-items: center; background: radial-gradient(ellipse at 50% 45%, #1a1726 0, #0b0a10 70%); }
  #dlg.mono .dlgSlot, #dlg.mono #dlgFace, #dlg.mono #dlgName { display: none; }
  #dlg.mono #dlgBox { background: none; border: none; box-shadow: none; justify-content: center; text-align: center; min-height: 40vh; align-items: center; max-width: 34em; padding: 24px 8px 40px; }
  #dlg.mono #dlgText { font-size: 18px; line-height: 2.1; color: var(--ink); text-wrap: pretty; }
  #dlg.mono #dlgBox.thought #dlgText { color: var(--ally); }
  #dlg.mono #dlgNext { right: 50%; transform: translateX(50%); bottom: 0; animation: none; color: var(--dim); }
  #dlgText.fadein { animation: lineIn .6s ease-out both; }
  @keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 560px) { #dlg.mono #dlgText { font-size: 16px; line-height: 2; } }
  @media (prefers-reduced-motion: reduce) { #dlgText.fadein { animation: none; } }
  .logList { display: flex; flex-direction: column; gap: 6px; }
  button.logItem { text-align: left; font-family: var(--text); }
  /* Sound settings: a small button on the title, the map HUD and the camp; the panel sits above every overlay. */
  .sndBtn { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 4px 10px; font-size: 13px; color: var(--dim); flex: none; }
  .sndBtn svg { width: 20px; height: 20px; }
  .sndBtn:hover { color: var(--ink); }
  #title .sndBtn { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
  .hudR { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .campHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #snd { z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(var(--shade), .72); padding: 16px; }
  .sndCard { width: min(360px, 100%); background: linear-gradient(#262238, #1b1828); border: 2px solid var(--gold); border-radius: 8px; padding: 16px;
    display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .6); }
  .sndCard h2 { margin: 0; font-family: var(--pixel); font-weight: normal; color: var(--gold); font-size: 18px; letter-spacing: .08em; }
  .sndRow { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 2.4em; align-items: center; gap: 10px; font-family: var(--pixel); }
  .sndRow b { font-weight: normal; text-align: right; font-variant-numeric: tabular-nums; }
  .sndRow input { width: 100%; min-height: 36px; margin: 0; accent-color: var(--gold); }
  #snd.muted .sndRow { opacity: .45; }
  #sndMute[aria-pressed="true"] { border-color: var(--foe); color: var(--foe); }
  .sndCard .hint { font-size: 12.5px; }
</style>

<main id="app">
  <header id="hud"><span id="chTitle"></span><span class="hudR"><span id="turn"></span><button class="sndBtn" type="button"></button></span></header>
  <div id="stage"><canvas id="cv" width="1440" height="960"></canvas><div id="banner" hidden></div>
    <div id="cutin" hidden><div class="ciband"></div><div class="ci l"><img alt=""></div><div class="ci r"><img alt=""></div><div class="cicrit">必殺！</div></div></div>
  <section id="panel"><div id="info"></div><div id="menu"></div></section>
  <p id="goal"></p>
</main>

<div id="camp" class="overlay" hidden>
  <div class="campIn">
    <div class="campHead"><h2 id="campTitle">章間</h2><button class="sndBtn" type="button"></button></div>
    <p id="campMsg" role="status"></p>
    <div id="campTabs" role="tablist">
      <button data-tab="units" role="tab">部隊</button>
      <button data-tab="bonds" role="tab">支援</button>
      <button data-tab="log" role="tab">記録</button>
    </div>
    <div id="campBody"></div>
    <div class="campBtns" id="campBtns">
      <button id="btnNext" class="primary">次の章へ</button>
      <button id="btnToTitle">タイトルへ</button>
    </div>
  </div>
</div>

<div id="dlg" class="overlay" hidden>
  <div class="dlgSlot left empty"><img alt=""></div>
  <div class="dlgSlot right empty"><img alt=""></div>
  <div id="dlgBox">
    <canvas id="dlgFace" width="200" height="200"></canvas>
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgNext">▼ タップで次へ</div>
  </div>
  <button id="dlgSkip" type="button">スキップ ▶▶</button>
</div>

<div id="title" class="overlay">
  <button class="sndBtn" type="button"></button>
  <div id="star"></div>
  <h1>フィットア奪還戦記</h1>
  <p>『無職転生』の非公式ファンゲーム（個人で遊ぶ用）。消えた故郷を、仲間と取り戻す。</p>
  <p id="titleMsg"></p>
  <div id="titleMain" class="btns">
    <button id="btnNew" class="primary">はじめから</button>
    <button id="btnLoad" hidden>つづきから</button>
  </div>
  <div id="diffPick" class="btns wide" hidden>
    <button data-diff="casual" class="diff"><b>カジュアル</b><small>倒れた仲間は撤退し、次の章で復帰する。敗北したら直前の自軍フェイズからやり直せる。</small></button>
    <button data-diff="classic" class="diff"><b>クラシック</b><small>倒れた仲間は戦線離脱し、以後は出撃できない。敗北すると章の最初から。</small></button>
    <button id="btnDiffBack">もどる</button>
  </div>
  <div id="defeat" class="btns" hidden>
    <button id="btnRetryPhase" class="primary">直前の自軍フェイズから</button>
    <button id="btnRetryChapter">章の最初から</button>
    <button id="btnDefeatTitle">タイトルへ</button>
  </div>
</div>
<div id="snd" class="overlay" hidden>
  <div class="sndCard" role="dialog" aria-modal="true" aria-labelledby="sndTitle">
    <h2 id="sndTitle">音の設定</h2>
    <label class="sndRow"><span>BGM</span><input id="sndBgm" type="range" min="0" max="100" step="5"><b id="sndBgmV"></b></label>
    <label class="sndRow"><span>効果音</span><input id="sndSfx" type="range" min="0" max="100" step="5"><b id="sndSfxV"></b></label>
    <button id="sndMute" type="button" aria-pressed="false">消音する</button>
    <p class="hint">設定はこの端末に保存される。曲がまだ届いていない場面は、仮の曲で流れる。</p>
    <button id="sndClose" type="button" class="primary">閉じる</button>
  </div>
</div>
